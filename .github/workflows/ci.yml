name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate VERSION format
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' docs/VERSION
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck
        run: shellcheck dclaude dcodex scripts/*.sh
      - name: Bash syntax
        run: bash -n dclaude dcodex scripts/*.sh

  storage_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Storage unit and wrapper tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  storage_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Real macOS filesystem and APFS probes
        run: python3 -m unittest discover -s tests -p 'test_space_macos.py' -v

  storage_desktop:
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Docker Desktop
        run: |
          curl --fail --location --retry 3 \
            https://desktop.docker.com/mac/main/amd64/238018/Docker.dmg \
            --output "$RUNNER_TEMP/Docker.dmg"
          echo "cb22c74b9c6c9c2768d64459828b6c2b0ab4d5b7ace4b28f0979d7de4f28e336  $RUNNER_TEMP/Docker.dmg" | shasum -a 256 -c -
          sudo hdiutil attach "$RUNNER_TEMP/Docker.dmg" -nobrowse
          sudo /Volumes/Docker/Docker.app/Contents/MacOS/install --accept-license --user="$USER"
          # The installer can hold the volume briefly; a mounted installer image
          # does not affect the Desktop daemon under test.
          sudo hdiutil detach /Volumes/Docker || {
            sleep 15
            sudo hdiutil detach /Volumes/Docker -force || echo 'warning: installer image still mounted' >&2
          }
          echo /Applications/Docker.app/Contents/Resources/bin >> "$GITHUB_PATH"
      - name: Start Docker Desktop
        run: |
          open /Applications/Docker.app
          for attempt in {1..120}; do
            if docker info >/dev/null 2>&1; then
              docker version
              docker buildx version
              docker context show
              docker buildx inspect default
              exit 0
            fi
            sleep 5
          done
          echo 'Docker Desktop did not become ready within 10 minutes.' >&2
          exit 1
      - name: Verify storage on disposable Docker Desktop data
        shell: bash
        env:
          DCLAUDE_SPACE_DISPOSABLE_TEST: "1"
        run: python3 tests/space_desktop_smoke.py 2>&1 | tee "$RUNNER_TEMP/space-desktop-smoke.log"
      - name: Preserve Desktop validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-desktop-validation
          path: |
            ${{ runner.temp }}/space-desktop-smoke.log
            ${{ runner.temp }}/space-desktop-evidence.json
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: SSH guardrails
        run: |
          export TOOL_HOME="$PWD"
          export HOST_HOME="$RUNNER_TEMP/dclaude-home"
          mkdir -p "$HOST_HOME/Desktop" "$HOST_HOME/Downloads"
          source scripts/agent-common.sh
          [ "$(normalize_home_mount_suffix "~/Desktop" "ci")" = "$HOST_HOME/Desktop" ]
          if (normalize_home_mount_suffix "~/.ssh" "ci"); then
            echo "expected ~/.ssh mount to be rejected" >&2
            exit 1
          fi
          if (normalize_home_mount_suffix "/run" "ci"); then
            echo "expected /run mount to be rejected" >&2
            exit 1
          fi
      - name: Build Docker image
        run: docker build -t "dclaude:$(cat docs/VERSION)" .
      - name: Docker build excludes repo-local .ssh
        run: |
          trap 'rm -rf .ssh' EXIT
          mkdir -p .ssh
          printf 'sentinel\n' > .ssh/marker
          docker build --pull=false -f - . <<EOF
          FROM dclaude:$(cat docs/VERSION)
          COPY . /ctx
          RUN test ! -e /ctx/.ssh && test ! -e /ctx/.ssh/marker
          EOF
      - name: Wrapper help
        run: |
          ./dclaude --help
          ./dcodex --help
      - name: Wrapper version
        run: |
          ./dclaude --version
          ./dcodex --version

  release_from_main:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    needs:
      - lint
      - smoke
      - storage_tests
      - storage_macos
      - storage_desktop
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    concurrency:
      group: dclaude-release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump patch version
        id: bump
        run: |
          version="$(python3 scripts/bump_version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Resolve release metadata
        id: meta
        run: |
          echo "tag=v${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Commit and tag release
        run: |
          git add docs/VERSION
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.tag }}"
          git push origin main "refs/tags/${{ steps.meta.outputs.tag }}"

  publish_release:
    if: ${{ needs.release_from_main.result == 'success' }}
    needs:
      - release_from_main
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release_from_main.outputs.tag }}
      target_ref: ${{ needs.release_from_main.outputs.tag }}
    secrets: inherit
