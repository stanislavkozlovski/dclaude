name: tool-updates

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh_tool_pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.TOOL_UPDATE_TOKEN }}

      - name: Refresh pinned tool versions
        id: refresh
        run: python3 scripts/sync_tool_versions.py --update --github-output "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build updated image
        if: steps.diff.outputs.changed == 'true'
        run: docker build -t dclaude:tool-updates .

      - name: Smoke updated tools
        if: steps.diff.outputs.changed == 'true'
        run: |
          docker run --rm dclaude:tool-updates cx --version
          docker run --rm dclaude:tool-updates claude --version
          docker run --rm dclaude:tool-updates bash -lc 'codex --version && codex --dangerously-bypass-approvals-and-sandbox --help >/dev/null'

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TOOL_UPDATE_TOKEN }}
          branch: chore/tool-version-updates
          delete-branch: true
          commit-message: ${{ steps.refresh.outputs.commit_message }}
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: ${{ steps.refresh.outputs.commit_title }}
          body: ${{ steps.refresh.outputs.pull_request_body }}
